<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Juan Martín Caparrós · Software Developer</title>
  <desc id="desc">Software Developer en Mercado Libre. Java, Spring Boot, Go y automatización con IA. Buenos Aires, Argentina.</desc>
  <defs>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
      .in{opacity:0;animation:in .7s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="50%" r="42%">
      <stop offset="0" stop-color="#b45309" stop-opacity=".14"/>
      <stop offset="1" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2328" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="958" height="298" rx="18"/></clipPath>
    <clipPath id="typing">
      <rect x="44" y="150" width="0" height="40">
        <animate attributeName="width" from="0" to="540" begin=".6s" dur="1.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="300" fill="url(#bg)"/>
    <rect width="960" height="300" fill="url(#grid)"/>
    <rect width="960" height="300" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="958" height="298" rx="18" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- La petición -->
  <g class="mono" font-size="14">
    <rect x="48" y="40" width="48" height="26" rx="6" fill="#0969da" fill-opacity=".14" stroke="#0969da" stroke-opacity=".55"/>
    <text x="72" y="58" text-anchor="middle" fill="#0969da" font-weight="700">GET</text>
    <text x="108" y="58" fill="#59636e">/api/v1/developers/<tspan fill="#1f2328">jcaparr</tspan></text>
    <g class="in" style="animation-delay:.3s">
      <rect x="346" y="40" width="84" height="26" rx="13" fill="#1a7f37" fill-opacity=".14"/>
      <circle class="pulse" cx="361" cy="53" r="4" fill="#1a7f37"/>
      <text x="372" y="58" fill="#1a7f37" font-weight="700">200 OK</text>
    </g>
  </g>

  <!-- Quién -->
  <text class="sans in" x="46" y="132" font-size="46" font-weight="700" fill="#1f2328" style="animation-delay:.1s">Juan Martín Caparrós</text>
  <g clip-path="url(#typing)">
    <text class="sans" x="48" y="178" font-size="22" fill="#31373d">Software Developer en <tspan fill="#b45309" font-weight="600">Mercado Libre</tspan></text>
  </g>
  <g class="mono in" font-size="16" style="animation-delay:2.1s">
    <text x="48" y="218" fill="#59636e">java <tspan fill="#6e7781">·</tspan> spring-boot <tspan fill="#6e7781">·</tspan> go <tspan fill="#6e7781">·</tspan> python <tspan fill="#6e7781">·</tspan> llm <tspan fill="#6e7781">·</tspan> n8n</text>
  </g>
  <rect class="blink" x="48" y="234" width="10" height="3" fill="#b45309"/>
  <g class="mono in" font-size="13" fill="#6e7781" style="animation-delay:2.4s">
    <path d="M54 255c-3.6 0-6.5 2.8-6.5 6.3 0 4.6 6.5 10.7 6.5 10.7s6.5-6.1 6.5-10.7c0-3.5-2.9-6.3-6.5-6.3zm0 8.7a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8z" fill="#6e7781"/>
    <text x="66" y="267">Buenos Aires, AR   ·   español / inglés B2   ·   backend + IA aplicada</text>
  </g>

  <!-- Los servicios -->
  <g fill="none" stroke="#d0d7de" stroke-width="2">
    <path d="M714 150 C772 150 772 82 830 82"/>
    <path d="M714 150 H830"/>
    <path d="M714 150 C772 150 772 218 830 218"/>
  </g>

  <g>
    <circle r="4" fill="#b45309">
      <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M714 150 C772 150 772 82 830 82" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.46;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#1a7f37">
      <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M714 150 C772 150 772 82 830 82" keyPoints="1;1;0" keyTimes="0;.55;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.54;.55;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#b45309">
      <animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite" path="M714 150 H830" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.46;1" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#1a7f37">
      <animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite" path="M714 150 H830" keyPoints="1;1;0" keyTimes="0;.55;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.54;.55;1" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#b45309">
      <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M714 150 C772 150 772 218 830 218" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.46;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#1a7f37">
      <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M714 150 C772 150 772 218 830 218" keyPoints="1;1;0" keyTimes="0;.55;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.54;.55;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="mono" font-size="13" text-anchor="middle">
    <rect x="610" y="131" width="104" height="38" rx="10" fill="#eff2f5" stroke="#b45309" stroke-width="1.5"/>
    <text x="662" y="155" fill="#1f2328" font-weight="700">api-rest</text>

    <rect x="830" y="63" width="104" height="38" rx="10" fill="#eff2f5" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="882" y="87" fill="#31373d">java-svc</text>

    <rect x="830" y="131" width="104" height="38" rx="10" fill="#eff2f5" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="882" y="155" fill="#31373d">go-svc</text>

    <rect x="830" y="199" width="104" height="38" rx="10" fill="#eff2f5" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="882" y="223" fill="#31373d">llm-agent</text>
  </g>

  <g class="mono" font-size="12">
    <circle class="pulse" cx="836" cy="263" r="4" fill="#1a7f37"/>
    <text x="846" y="267" fill="#6e7781">3/3 healthy</text>
  </g>
</svg>
